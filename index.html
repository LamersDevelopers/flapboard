<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7b7872">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Табло</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body class="white">
  <div id="stage">
    <div id="frame"></div>
  </div>

  <div id="status"><span id="statusText"></span><span id="spinner"></span></div>
  <div id="toast"></div>
  <div id="bar">
    <button data-a="prev">◀</button><button data-a="pause">⏯</button><button data-a="next">▶</button>
    <button data-a="menu">☰ Темы и настройки</button><button data-a="full">⛶</button>
  </div>
  <div id="rotate">↻ Поверните телефон горизонтально — доска станет крупнее</div>
  <div id="hint">OK — меню · ◀ ▶ — листать · ▲ ▼ — тема · ⏯ — пауза</div>

  <div id="menu" class="hidden">
    <div class="panel">
      <div class="col" id="colThemes">
        <h2>Тема</h2>
        <label class="item input" data-k="custom"><span class="lbl">✎ Своя тема</span>
          <input id="customInput" type="text" placeholder="например: SAAB 900, отпуск, кофе…" autocomplete="off"></label>
        <div id="themeList"></div>
      </div>
      <div class="col" id="colSettings">
        <h2>Настройки</h2>
        <div class="item select" data-k="mode"><span class="lbl">Содержимое</span><span class="val"></span></div>
        <div class="item select" data-k="interval"><span class="lbl">Смена каждые</span><span class="val"></span></div>
        <div class="item select" data-k="sound"><span class="lbl">Звук</span><span class="val"></span></div>
        <div class="item select" data-k="style"><span class="lbl">Доска</span><span class="val"></span></div>
        <div class="item select" data-k="lang"><span class="lbl">Язык</span><span class="val"></span></div>
        <label class="item input" data-k="city"><span class="lbl">Город (погода)</span>
          <input id="cityInput" type="text" autocomplete="off"></label>
        <div class="item button" data-k="close"><span class="lbl">Готово</span></div>
        <p class="help">▲▼ — выбор · OK — изменить · ◀ ▶ — колонки · BACK — закрыть<br>
          Цветные кнопки: <b class="kr">●</b> звук <b class="kg">●</b> режим <b class="ky">●</b> пауза <b class="kb">●</b> доска</p>
      </div>
    </div>
  </div>

  <script src="js/content.js"></script>
  <script src="js/board.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
